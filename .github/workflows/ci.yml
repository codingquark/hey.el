name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs:
          - "28.2"
          - "30.2"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Emacs
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: ${{ matrix.emacs }}

      - name: Install markdown-mode 2.8 and package-lint
        run: make bootstrap

      - name: Run complete isolated gate
        run: make check
