name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs:
          - "28.2"
          - "30.2"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Install markdown-mode 2.8 and package-lint
        run: make bootstrap

      - name: Run complete isolated gate
        run: make check
